site_name: SimCrux Documentation
site_url: https://docs.simcrux.app/
site_description: >-
  The SimCrux user guide — installing, writing simcrux.yaml, running parallel
  regressions, pass/fail detection, the results dashboard, waveform debug,
  trends and flaky tests, CI, and the team database.
copyright: Copyright &copy; 2026 Ferrite Engineering LLC
use_directory_urls: false
docs_dir: docs
theme:
  name: material
  logo: assets/logo.png
  favicon: assets/favicon.png
  font: false
  palette:
    # Dark first, matching the marketing site; the toggle offers light.
    - scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: material/weather-sunny, name: Switch to light mode }
    - scheme: default
      primary: custom
      accent: custom
      toggle: { icon: material/weather-night, name: Switch to dark mode }
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
extra:
  homepage: https://simcrux.app
extra_css:
  - assets/brand.css
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc: { permalink: true }
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed: { alternate_style: true }
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.keys
  # The SVA support table on formal.md is generated from the measured probe
  # matrix (tool/generate_sva_support_table.dart) into generated/, outside
  # docs_dir, and included from there so it is never copied by hand.
  - pymdownx.snippets:
      base_path: [generated]
      check_paths: true
validation:
  omitted_files: warn
  absolute_links: info
  unrecognized_links: warn
  anchors: warn
nav:
  - Getting started:
      - Overview: index.md
      - Installation & first regression: getting-started.md
      - The interface: interface.md
      - Appearance & themes: appearance-and-themes.md
      - Keyboard & mouse reference: keyboard-mouse.md
      - Tiers & licensing: licensing.md
  - Running regressions:
      - Projects & simulators: projects-and-simulators.md
      - Running tests: running-tests.md
      - Pass/fail detection: pass-fail-detection.md
      - The results dashboard: results-dashboard.md
      - Waveforms & debug: waveforms-and-debug.md
  - Formal & implementation flow:
      - Formal verification, from 1.2: formal.md
      - Implementation flow, from 1.2: flow.md
      - nextpnr runs: flow-nextpnr.md
      - LibreLane runs: flow-librelane.md
      - Ingesting runs: flow-ingest.md
      - The Flow Runs panel: flow-runs.md
      - Hand-off to viewers: flow-handoff.md
      - Gate-level simulation: flow-gate-level.md
      - CI gate for implementation runs: flow-ci.md
      - Troubleshooting implementation runs: flow-troubleshooting.md
  - Track & ship:
      - Trends, flaky tests & seeds: trends-and-flaky.md
      - Baselines, CI & exports: baselines-ci-exports.md
      - Command line & CI: cli.md
      - CI recipes: ci.md
      - Publishing the results dashboard: ci-integration.md
      - The web dashboard: web-mode.md
      - Team results database: team-database.md
      - Cross-probe & the suite: integrations.md
      - Use in VS Code: vscode.md
      - Updates, usage statistics & issue reporting: integrations/updates-and-feedback.md
  - Migrating:
      - migrating/index.md
      - From Makefiles: migrating/from-makefiles.md
      - From VUnit: migrating/from-vunit.md
      - From FuseSoC: fusesoc-import.md
  - Administration:
      - Org-wide configuration: administration.md
      - Local database safety: data-safety.md
      - Policy file reference: https://edacrux.app/policy-reference
      - Audit log: https://edacrux.app/audit-log
      - Deployment: https://edacrux.app/deployment
  - Cookbook:
      - Workflow recipes: cookbook.md
      - Run your first regression: cookbook-first-regression.md
      - Triage failures & open the waveform: cookbook-triage-failures.md
      - Hunt down flaky tests: cookbook-flaky-tests.md
      - Run a seed sweep: cookbook-seed-sweep.md
