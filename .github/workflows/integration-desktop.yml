name: Integration (Desktop — macOS, Linux, Windows)

# ─── Trigger configuration ─────────────────────────────────────────────────────
# Runs the integration_test/ suite against a real SimCrux build.
#
# Why this exists: `flutter test` in ci.yml defaults to test/ only, so without
# this workflow the integration suite is executed by nothing but a human, and
# a suite nothing runs rots silently.
#
# WEEKLY, not per-push. These boot a real desktop app, so they are slow, and
# macOS runners bill at 10x — a hung 6-hour macOS job once drained the monthly
# budget, which is why every job below carries a timeout.
#
# macOS, Linux and Windows. Until 2026-09-21 this ran on macOS alone, so a
# Linux- or Windows-only regression in a desktop product reached users without
# an integration run ever having booted the app there; SimCrux ships on all
# three. Linux runs the app under xvfb. All three legs stay WEEKLY and never
# per push: Windows bills at twice the Linux rate and macOS at ten times.
# Measured 2026-09-21 on the open-core suites: 8-12 minutes a run on Linux,
# 13-18 on Windows. At one run a week that is about $0.40 (Linux) and $1.25
# (Windows) a month per repository; the job timeout is the hard ceiling on
# any one run.
#
# The `os` input runs a single leg on dispatch, for cheap validation.
on:
  workflow_dispatch:
    inputs:
      subdirs:
        description: 'Integration subdirectories to run (space-separated; empty = all)'
        required: false
        default: ''
      os:
        description: 'Which leg to run (all, macos, linux, windows)'
        required: false
        default: 'all'
        type: choice
        options: [all, macos, linux, windows]
  schedule:
    # Thursday 06:20 UTC. Deliberately offset from the other products' suites
    # so four desktop runs do not land on the same runner pool at once.
    - cron: '0 7 * * 4'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false   # never cancel a half-finished desktop run

permissions:
  contents: read

jobs:
  integration:
    name: Integration / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # All three on the schedule (the input is empty there); one leg when
        # a dispatch names it.
        include: ${{ fromJSON(inputs.os == 'macos' && '[{"os":"macos-latest","device":"macos"}]' || inputs.os == 'linux' && '[{"os":"ubuntu-latest","device":"linux"}]' || inputs.os == 'windows' && '[{"os":"windows-latest","device":"windows"}]' || '[{"os":"macos-latest","device":"macos"},{"os":"ubuntu-latest","device":"linux"},{"os":"windows-latest","device":"windows"}]') }}
    # Cost guardrail: no job may run unbounded. The suite is ~12 files, each
    # booting the app; 90 minutes is generous against a measured baseline and
    # bounded against a hang.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          submodules: recursive
          # SUBMODULE_PAT when defined, else the workflow token (fork PRs get
          # no secrets; the workflow token reads a public crux-shared).
          token: ${{ secrets.SUBMODULE_PAT || github.token }}

      - name: Install Flutter (pinned)
        id: flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ${{ steps.flutter.outputs.pub-cache-path }}
            .dart_tool/
          key: pub-integration-${{ matrix.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-integration-${{ matrix.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Generate l10n
        run: flutter gen-l10n

      - name: Install Linux desktop build deps + xvfb
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev xvfb

      - name: Enable ${{ matrix.device }} desktop
        run: flutter config --enable-${{ matrix.device }}-desktop

      # One `flutter test` invocation per file: flutter_tools does not tear the
      # observatory connection down cleanly between integration_test files in a
      # single invocation. The script also retries the macOS relaunch race —
      # and only that race — reporting how often it fired so a worsening trend
      # is visible even while the suite stays green.
      - name: Run integration tests
        # bash on all three: Windows runs the same script under Git Bash, and
        # Linux wraps it in a virtual display.
        shell: bash
        run: |
          chmod +x tool/run_integration_tests.sh
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a --server-args="-screen 0 1920x1080x24" \
              tool/run_integration_tests.sh -d linux ${{ github.event.inputs.subdirs }}
          else
            tool/run_integration_tests.sh -d ${{ matrix.device }} ${{ github.event.inputs.subdirs }}
          fi

      - name: Upload per-file logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-logs-${{ matrix.device }}
          path: build/integration_test_logs/
          if-no-files-found: ignore
