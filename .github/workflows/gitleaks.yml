name: gitleaks

# Secret scanning that does not depend on a GitHub plan or a paid wrapper.
#
# WHY THIS REPOSITORY, AND WHY NOW
# This is an open core. It is private today and public at the 1.0 flip, and
# the flip is a single irreversible moment: every commit in this history
# becomes readable at once. A scan that starts the day the repository opens
# is a scan that reports its findings to the internet. So it runs now, while
# the history is still closed and a finding is still something that can be
# fixed by rewriting a history nobody has cloned.
#
# WHY NOT `gitleaks/gitleaks-action`
# From v2 that Action refuses to run against any repository owned by an
# ORGANIZATION without a paid `GITLEAKS_LICENSE`, and this repository is
# organization-owned. The gitleaks binary itself is MIT-licensed and free;
# only the Action wrapper is not. So this job fetches a pinned release, checks
# its SHA-256 against the value recorded below, and runs the binary directly.
#
# WHY TWO SCANS
#   `gitleaks git` — every commit reachable from the checkout. This is the
#     scan that matters before a repository goes public, and it is why the
#     checkout is not shallow.
#   `gitleaks dir` — the files on disk, whether git tracks them or not.
#     Measured: a `.dev.vars` listed in `.gitignore` is still scanned by `dir`.
#     That is the point — ignoring a credential file stops it being committed,
#     it does not stop it existing, and this is the scan that says so.
#
# WHY THE SUBMODULE IS NOT CHECKED OUT
# `crux-shared` is a submodule here, and `actions/checkout` leaves submodules
# alone unless asked. That is deliberate: crux-shared runs this same job in
# its own repository, over its own full history. Checking it out here would
# scan its working tree a second time and still miss its history, which is the
# half that matters.
#
# GitHub's own secret scanning and push protection are the other half, enabled
# per repository in its settings. They catch a live provider token at push
# time; this job catches shapes the partner patterns do not cover, and it
# works while the repository is still private.
#
# A false positive is suppressed with a `gitleaks:allow` trailing comment on
# the offending line, or with a `.gitleaksignore` entry keyed by fingerprint —
# never by deleting this job. Repo-specific rules go in a `.gitleaks.toml` at
# the repository root, which gitleaks picks up on its own.
#
# Whatever the suppression, it must never quote the value it is suppressing.
# The history scan reads every commit, so a comment that reproduces a flagged
# string to explain it becomes a finding in its own right on the next run.
# Describe the value; do not write it down.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Monday 06:00 UTC. A weekly run means a pattern added upstream finds an
    # old commit without waiting for someone to touch the repository.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pinned deliberately. `latest` here would mean a third party choosing what
  # runs in CI, and a new gitleaks rule landing as a red build on a repository
  # nobody changed. Bump this and the checksum together; the checksum comes
  # from that release's own `gitleaks_<version>_checksums.txt`.
  GITLEAKS_VERSION: '8.30.1'
  GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'

jobs:
  gitleaks:
    name: Secrets (history + working tree)
    runs-on: ubuntu-latest
    # Cost guardrail: every job carries a cap, no exceptions — a hung job has
    # drained a month's Actions budget before. This one runs in well under a
    # minute on every repository here.
    timeout-minutes: 15
    steps:
      # Pinned to a commit, not a tag: a job whose whole purpose is to say
      # what is in this repository should not itself run code that a movable
      # tag can change under it.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # `gitleaks git` scans what it can reach. A shallow checkout would
          # scan one commit and report success, which is worse than not
          # running at all.
          fetch-depth: 0

      - name: Install gitleaks (pinned, checksum-verified)
        # Installed outside the checkout on purpose: the working-tree scan
        # below would otherwise spend its time on a 21 MB binary this job
        # just downloaded.
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 "$url" -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          ./gitleaks version

      # `--log-level error` is deliberately ABSENT. gitleaks logs its findings
      # at WARN, so suppressing WARN makes a failing job print no finding at
      # all — just `Process completed with exit code 1`. That shipped here
      # once and cost two agents a local re-run each to discover what had
      # tripped, and briefly produced two "clean" reports for repositories
      # that were actually failing. A gate that fails without saying why is
      # the exact defect a secret-scanning gate exists to remove.
      #
      # `--redact` still means the secret's VALUE is never printed; the file,
      # line, rule and fingerprint are, which is what a human needs.
      - name: Scan every commit in the history
        run: '"$RUNNER_TEMP/gitleaks" git . --redact --no-banner --report-format json --report-path "$RUNNER_TEMP/gitleaks-history.json"'

      - name: Scan the working tree, tracked or not
        # `--follow-symlinks` is deliberately off: a symlink out of the
        # checkout is not this repository's content.
        #
        # One path argument only. `gitleaks dir a b c` silently ignores the
        # paths and scans `.` — measured, after it produced 71 phantom
        # findings out of a stale browser profile under `.dart_tool`.
        run: '"$RUNNER_TEMP/gitleaks" dir . --redact --no-banner --report-format json --report-path "$RUNNER_TEMP/gitleaks-worktree.json"'

      # Belt and braces: the log carries the findings, and the report survives
      # as an artifact even when the log is long or truncated.
      - name: Keep the reports when something tripped
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gitleaks-reports
          path: |
            ${{ runner.temp }}/gitleaks-history.json
            ${{ runner.temp }}/gitleaks-worktree.json
          if-no-files-found: ignore
          retention-days: 14
