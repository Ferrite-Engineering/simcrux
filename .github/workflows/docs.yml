name: docs

# Builds the SimCrux user documentation (docs-site/) on every pull request
# that touches it, and deploys it to docs.simcrux.app (Workers Static Assets)
# on merge to main.
on:
  pull_request:
    paths:
      - 'docs-site/**'
      - '.github/workflows/docs.yml'
  push:
    branches: [main]
    paths:
      - 'docs-site/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Cost guardrail: no job may run unbounded.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install MkDocs Material
        run: |
          pip install --upgrade pip
          # Pygments is pinned too, and that is the whole point of this block.
          # mkdocs/material/pymdownx were already pinned but Pygments floated,
          # so the pin was only ever three-quarters of a pin. Pygments 2.20.0
          # made HtmlFormatter escape `options.get('filename', '')`, and
          # pymdownx passes `filename=None` — an explicit None, so the `''`
          # default never applies — which crashes the build with
          # "'NoneType' object has no attribute 'replace'". Reproduced locally:
          # 2.20.0 fails, 2.19.2 builds clean, and bumping pymdownx to 10.16
          # does NOT help, so Pygments is the one that has to be held.
          pip install \
            mkdocs==1.6.0 \
            mkdocs-material==9.5.27 \
            pymdown-extensions==10.9 \
            Pygments==2.19.2

      - name: Build docs
        working-directory: docs-site
        run: mkdocs build --strict

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: simcrux-docs
          path: docs-site/site

  deploy:
    # Credentials: a docs-only token (CLOUDFLARE_DOCS_API_TOKEN, a repository
    # secret) that can deploy Workers on this product's zone and nothing else,
    # and the account id as the CLOUDFLARE_ACCOUNT_ID repository variable (it
    # is not a secret). The suite's release-publishing token is deliberately
    # not used here: it can write release downloads.
    needs: build
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for Cloudflare credentials
        id: creds
        env:
          CLOUDFLARE_DOCS_API_TOKEN: ${{ secrets.CLOUDFLARE_DOCS_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_DOCS_API_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_DOCS_API_TOKEN is not set; skipping the docs deploy."
            echo "Docs deploy skipped: the CLOUDFLARE_DOCS_API_TOKEN secret is not configured for this repository." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Download built site
        if: steps.creds.outputs.present == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: simcrux-docs
          path: docs-site/site

      - name: Deploy to Workers Static Assets
        if: steps.creds.outputs.present == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          # The action installs wrangler 3.90 unless told otherwise, which predates
          # wrangler.jsonc and fails with "Missing entry-point". Pin a v4 release.
          wranglerVersion: "4.132.0"
          workingDirectory: docs-site
          apiToken: ${{ secrets.CLOUDFLARE_DOCS_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
