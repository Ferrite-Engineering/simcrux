<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="SimCrux results viewer: a read-only dashboard for HDL simulation regressions. Open the results.ndjson or simcrux-results.json a SimCrux run writes and browse every test's result by suite, in the browser.">
  <meta name="theme-color" content="#5C6BC0">

  <!-- Open Graph / social preview -->
  <meta property="og:title" content="SimCrux results viewer">
  <meta property="og:description" content="A read-only dashboard for HDL simulation regression results">
  <meta property="og:type" content="website">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="SimCrux">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>SimCrux results viewer</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    First-party page-view beacon (analytics.js): one cookieless page view per
    application load, under the `simcrux-app` site slug. See the file for what
    it sends and what it does not store.
  -->
  <script src="analytics.js" defer></script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
